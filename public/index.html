<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis Salud - Asistente Clínico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #006655;
            margin-top: 0;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            resize: vertical;
        }
        button {
            background-color: #006655;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004d40;
        }
        #response {
            margin-top: 20px;
            padding: 15px;
            background: #eef7f5;
            border-left: 5px solid #006655;
            border-radius: 6px;
            white-space: pre-wrap;
            min-height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vitalis Salud</h1>
    <p><strong>Dr. Anthony José Passaro Rebolledo</strong> - Medicina General y Familiar</p>
    
    <label for="prompt">Consulta o requerimiento clínico:</label>
    <textarea id="prompt" placeholder="Escriba aquí la consulta o datos del paciente..."></textarea>
    
    <button onclick="enviarConsulta()">Consultar Asistente</button>

    <h3>Respuesta:</h3>
    <div id="response">Esperando consulta...</div>
</div>

<script>
async function enviarConsulta() {
    const promptInput = document.getElementById('prompt').value;
    const responseDiv = document.getElementById('response');

    if (!promptInput.trim()) {
        alert('Por favor ingrese una consulta.');
        return;
    }

    responseDiv.innerText = 'Procesando consulta con Gemini...';

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: promptInput })
        });

        const data = await res.json();
        if (data.success) {
            responseDiv.innerText = data.text;
        } else {
            responseDiv.innerText = 'Error: ' + data.error;
        }
    } catch (err) {
        responseDiv.innerText = 'Error de conexión con el servidor.';
    }
}
</script>

</body>
</html>
